[project]
name = "screenrec"
version = "0.1.0"
description = "Cross-platform screen recording CLI (Python + mss)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mss>=10.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
screenrec = "screenrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
